# tentacles example config.
#
# Paths are repo-relative so `tentacles --config configs/config.example.yaml
# --dry-run` works on a dev box (backend=process, throwaway key). For
# production, copy to /etc/tentacles/config.yaml, point the paths at the
# production locations listed in README.md, set backend=systemd, and keep
# the version and verified sha256 together.

github:
  url: https://github.com
  app:
    client_id: Iv1.xxxxxxxx
    installation_id: 12345678
    private_key_path: testdata/dry-run.pem
  scope:
    kind: organization          # organization | repository
    owner: my-org
    repository: ""              # required if kind=repository

scale_set:
  name: debian-host             # this is runs-on
  runner_group: Default
  extra_labels: []              # github.com cloud: usually just the name

capacity:
  min_runners: 0
  max_runners: 4
  job_cpu_quota_percent: 400    # systemd CPUQuota
  job_memory_max: 8G

runner:
  version: 2.337.0              # pin in production; omit to track the latest release
                                # (version and sha256 resolved from the releases API)
  download_url: ""              # optional override; default GitHub release
  sha256: 70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613  # actions-runner-linux-x64-2.337.0.tar.gz
  work_directory: _work
  disable_update: true
  user: gha-runner
  group: gha-runner
  environment_file: configs/runner.env.example

paths:
  state_dir: var/lib/tentacles
  cache_dir: var/cache/tentacles
  log_dir: var/log/tentacles

scaling:
  admission_control: true       # hold new slots when predicted usage exceeds budget
  cpu_target_percent: 90        # share of host cores reserved by live runners
  memory_margin_percent: 20     # share of MemAvailable kept free
  sample_interval: 30s          # usage sampling period

runtime:
  backend: process              # systemd | process; process for local dry-run
  slot_start_timeout: 90s
  slot_stop_timeout: 30s
  cleanup_timeout: 60s
  acquire_grace: 3m

observability:
  listen: 127.0.0.1:9090
  log_level: info
  ship_diag: true
  diag_max_age: 168h            # remove completed archives older than 7 days
  diag_max_bytes: 1073741824    # keep at most 1 GiB of completed diagnostics
