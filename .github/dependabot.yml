# Dependabot covers Go modules and GitHub Actions only.
# Not covered: the go directive in go.mod, runner.version/sha256, and the
# actionlint/govulncheck @version pins in ci.yml. Bump those manually.
version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    # Cap version PRs; security PRs have a separate fixed limit.
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      # actions/scaleset is a deliberate preview-API pin (see README Upgrades).
      # Keep it isolated: preview bumps may need a Go toolchain bump and
      # adapter changes. Do not auto-merge this group.
      go-preview:
        applies-to: version-updates
        patterns:
          - "github.com/actions/scaleset"
      go-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/actions/scaleset"
        update-types:
          - "minor"
          - "patch"
      # Security updates bypass schedule and cooldown. Grouping them cuts CI
      # runs; a failing fix blocks the group until it is split.
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      # Minor/patch action bumps are one PR; major bumps stay individual.
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
